name: arthur-deckard

# The password of the Elasticsearch beside Deckard: for `elastic` (you, in Kibana),
# Kibana's own user and the `deckard` user the example config sends as. Set it in .env.
x-elastic-password: &elastic-password ${ELASTIC_PASSWORD:-changeme}
x-elastic-image: &elastic-image docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.5.5}

services:
  deckard:
    image: arthurplatform/deckard:${DECKARD_VERSION-0.2.0}
    platform: linux/amd64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # Longer than the engine's own 15s wait for running scans, so a scan that finishes
    # inside it gets to report its outcome before the container is killed.
    stop_grace_period: "30s"
    env_file:
      - path: .env
        required: false
    environment:
      ML_ENGINE_DISCOVERY_CONFIG: /etc/deckard/discovery.yaml
      ELASTIC_PASSWORD: *elastic-password
    volumes:
      - ./discovery.yaml:/etc/deckard/discovery.yaml:ro
      # Files the config reads with {file: secrets/...}, resolved beside the config.
      - ./secrets:/etc/deckard/secrets:ro
      # This machine's scan, written by ./scan-local.sh, for the `local` source.
      - ./local-scan:/etc/deckard/local-scan:ro
    depends_on:
      # So the scan at startup has a user to send as.
      elastic-setup:
        condition: service_completed_successfully
      # A one-shot nothing depends on fails `up --wait` once it exits, which a fast one
      # does before Compose checks. Costs Deckard the ~30s Kibana takes to start.
      kibana-setup:
        condition: service_completed_successfully
    healthcheck:
      test: wget -qO - http://127.0.0.1:7492/health
      interval: 30s
      timeout: 5s
      retries: 5

  # Where the example config sends events. Browse them in Kibana, below.
  elasticsearch:
    image: *elastic-image
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: *elastic-password
      xpack.security.enabled: "true"
      # Plain HTTP, on Compose's private network and this machine's loopback only.
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - 127.0.0.1:9200:9200
    healthcheck:
      # Up once it answers, even if only to refuse: setup.sh says why a password is wrong.
      test: curl -s -o /dev/null -w '%{http_code}' http://localhost:9200 | grep -qE '^(200|401)$$'
      interval: 5s
      timeout: 5s
      retries: 60

  # http://localhost:5601/app/discover, as user elastic.
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.5.5}
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: *elastic-password
      TELEMETRY_OPTIN: "false"
    ports:
      - 127.0.0.1:5601:5601
    depends_on:
      elastic-setup:
        condition: service_completed_successfully
    healthcheck:
      # Kibana redirects to its login page once it's ready.
      test: curl -s -o /dev/null -w '%{http_code}' http://localhost:5601 | grep -q '^302$$'
      interval: 5s
      timeout: 5s
      retries: 60

  # One-shot: Deckard's least-privileged user, and Kibana's password.
  elastic-setup:
    image: *elastic-image
    command: ["sh", "/setup/setup.sh", "elasticsearch"]
    environment:
      ELASTIC_PASSWORD: *elastic-password
    volumes:
      - ./elastic:/setup:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # One-shot: the Kibana data view Discover opens Deckard's events in.
  kibana-setup:
    image: *elastic-image
    command: ["sh", "/setup/setup.sh", "kibana"]
    environment:
      ELASTIC_PASSWORD: *elastic-password
    volumes:
      - ./elastic:/setup:ro
    depends_on:
      kibana:
        condition: service_healthy

volumes:
  elasticsearch-data:
