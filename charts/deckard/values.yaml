image:
  repository: arthurplatform/ml-engine
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Your discovery.yaml: sources, schedule and destination. Required.
#
#   helm install deckard ./charts/deckard --set-file config=discovery.yaml
#
# Credentials it references as ${NAME} come from a Secret named deckard-credentials, in
# the release's namespace, which you create. Each key becomes an environment variable:
#
#   kubectl create secret generic deckard-credentials \
#     --from-literal=SPLUNK_HEC_TOKEN=... \
#     --from-file=GCP_SERVICE_ACCOUNT_KEY=gcp-key.json
#
# Reference: https://github.com/arthur-ai/arthur-engine/blob/main/ml-engine/docs/standalone-discovery.md
config: ""

serviceAccount:
  # For sources that use the pod's own cloud identity instead of a key: IRSA
  # (eks.amazonaws.com/role-arn) or GKE Workload Identity (iam.gke.io/gcp-service-account).
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

nodeSelector: {}
tolerations: []
