config: |
  version: 1
  schedule:
    interval: 15m
  sources:
    - name: vertex-prod
      vendor: gcp_vertex
      fields:
        - {key: project_id, value: my-gcp-project}
        - {key: service_account_key, value: "${GCP_SERVICE_ACCOUNT_KEY}"}
      configs:
        - name: agent-engines
          query: ""
          query_language: none
          lookback_window_seconds: 3600
  destination:
    type: webhook
    url: https://hooks.example.com/arthur
    headers:
      Authorization: "Bearer ${WEBHOOK_TOKEN}"
  emit_scan_outcomes: true
