{{- if not .Values.config }}
{{- fail "Deckard needs a discovery config: --set-file config=discovery.yaml" }}
{{- end }}
# A Secret rather than a ConfigMap: a config can hold a credential written inline.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deckard.fullname" . }}-config
  labels:
    {{- include "deckard.labels" . | nindent 4 }}
type: Opaque
stringData:
  discovery.yaml: |
    {{- .Values.config | nindent 4 }}
