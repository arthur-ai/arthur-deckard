{{- if not .Values.existingConfigSecret.name }}
{{- if not .Values.config }}
{{- fail "Deckard needs a discovery config: set `config` (e.g. --set-file config=discovery.yaml) or `existingConfigSecret.name`." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deckard.configSecretName" . }}
  labels:
    {{- include "deckard.labels" . | nindent 4 }}
type: Opaque
stringData:
  discovery.yaml: |
    {{- include "deckard.config" . | nindent 4 }}
{{- end }}
{{- if .Values.secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deckard.fullname" . }}-env
  labels:
    {{- include "deckard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.secretFiles.files (not .Values.secretFiles.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deckard.secretFilesName" . }}
  labels:
    {{- include "deckard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $contents := .Values.secretFiles.files }}
  {{ $name | quote }}: {{ $contents | toString | quote }}
  {{- end }}
{{- end }}
