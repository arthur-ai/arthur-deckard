apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deckard.fullname" . }}
  labels:
    {{- include "deckard.labels" . | nindent 4 }}
spec:
  # Always one: a second pod would run every scan again and send every agent twice.
  # Recreate keeps a rollout from briefly running two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "deckard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "deckard.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "deckard.fullname" . }}
      automountServiceAccountToken: false
      # Longer than Deckard's own 15s wait for running scans, so a scan that finishes
      # inside it gets to report its outcome.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deckard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ML_ENGINE_DISCOVERY_CONFIG
              value: /etc/deckard/discovery.yaml
          # Optional, so a config that needs no credentials needs no Secret. A ${NAME} the
          # config uses and the Secret lacks stops Deckard at startup, naming it.
          envFrom:
            - secretRef:
                name: deckard-credentials
                optional: true
          # The health server listens on 127.0.0.1 only, so the kubelet cannot reach it
          # with an httpGet probe; it is checked from inside the container.
          livenessProbe:
            exec:
              command: ["wget", "-qO", "-", "http://127.0.0.1:7492/health"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/deckard
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ include "deckard.fullname" . }}-config
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
      nodeSelector:
        # The image is built for amd64 only.
        kubernetes.io/arch: amd64
        {{- with .Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
